[project]
name = "racp-agent"
version = "0.1.8"
requires-python = ">=3.12,<3.13"
dependencies = [
    "racp-domain",
    "racp-protocol",
    "racp-policy",
    "racp-observability",
    "racp-sdk",
    "websockets>=14,<17",
    "httpx>=0.28,<1",
    "psutil>=6,<8",
    "pywin32>=308; sys_platform == 'win32'",
    "playwright==1.63.0",
    "Pillow==12.3.0",
    "comtypes==1.4.17; sys_platform == 'win32'",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[project.scripts]
racp-agent = "racp_agent.main:main"
racp-agentctl = "racp_agent.background:main"
racp-connect = "racp_agent.connect:main"
racp-session-broker = "racp_agent.broker.main:main"
racp-login-broker = "racp_agent.broker.login:main"
racp-agent-service = "racp_agent.service_host:main"
racp-gdb-plugin = "racp_agent.plugins.gdb_plugin:main"
racp-ghidra-plugin = "racp_agent.plugins.ghidra_plugin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
