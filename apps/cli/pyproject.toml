[project]
name = "racp-cli"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["racp-domain", "racp-protocol", "racp-sdk", "httpx>=0.28,<1", "pywin32>=308; sys_platform == 'win32'"]

[project.scripts]
racp = "racp_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
