[package]
name = "racp-client-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "racp-client"
path = "src/main.rs"

[dependencies]
racp-contract = { path = "../../crates/racp-contract" }
racp-core = { path = "../../crates/racp-core" }
serde.workspace = true
tokio.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
# Slint 1.17+ needs Rust 1.92; the workspace pins Rust 1.90. Software renderer only (ADR-0032).
slint = { version = "=1.16.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }

[build-dependencies]
slint-build = "=1.16.1"

[target.'cfg(windows)'.dependencies]
racp-runtime = { path = "../../crates/racp-runtime" }
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Security_Authorization","Win32_System_Threading","Win32_System_RemoteDesktop","Win32_System_LibraryLoader","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_Globalization"]}

