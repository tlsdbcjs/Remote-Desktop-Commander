[package]
name = "racp-client-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "racp-client"
path = "src/main.rs"

[features]
default = ["software-renderer"]
software-renderer = []
gpu-renderer = ["iced/wgpu"]

[dependencies]
iced = { workspace = true, features = ["advanced", "svg"] }
racp-contract = { path = "../../crates/racp-contract" }
racp-core = { path = "../../crates/racp-core" }
serde.workspace = true
chrono = { workspace = true }
tokio.workspace = true
serde_json.workspace = true
image = { version = "=0.25.9", default-features = false, features = ["png"] }
tokio-util.workspace = true
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
racp-runtime = { path = "../../crates/racp-runtime" }
accesskit = "=0.25.1"
accesskit_windows = "=0.35.1"
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Security_Authorization","Win32_System_Threading","Win32_System_RemoteDesktop","Win32_System_LibraryLoader","Win32_UI_WindowsAndMessaging","Win32_UI_HiDpi","Win32_UI_Shell","Win32_Graphics_Gdi"]}

