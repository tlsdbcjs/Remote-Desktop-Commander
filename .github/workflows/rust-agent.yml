name: rust-agent
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run deferred native acceptance tests
        type: boolean
        default: false
  push:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "apps/agent-rust/**", "xtask/**", ".github/workflows/rust-agent.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "apps/agent-rust/**", "xtask/**", ".github/workflows/rust-agent.yml"]
concurrency:
  group: rust-agent-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows-agent-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build and verify standalone Windows Rust Agent
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- stage-agent --build-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Agent build failed" }
          cargo run --locked -p xtask -- verify-agent --build-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Agent integrity failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: racp-agent-win-x64-${{ github.sha }}
          path: |
            dist/agent/**/ci-${{ github.run_id }}-${{ github.run_attempt }}/build/**
          if-no-files-found: error
          retention-days: 14
  windows-rust:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
      RACP_TEST_CHROMIUM_PATH: ${{ github.workspace }}/.tools/playwright/chromium-1243/chrome-win64/chrome.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Stage pinned native Chromium for provider acceptance tests
        run: npx --yes --package=playwright@1.63.0 playwright install chromium
      - name: Windows process memory acceptance
        run: cargo test -p racp-runtime --test memory --locked
      - run: cargo test --workspace --locked
      - run: cargo build -p racp-agent -p racp-runtime --examples --locked
      - run: cargo build -p racp-agent --locked
