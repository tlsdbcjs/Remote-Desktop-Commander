name: rust-agent
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run deferred native acceptance tests
        type: boolean
        default: false
      package_artifacts:
        description: Create an unsigned Agent-only service setup artifact; never install/register/start
        type: boolean
        default: false
  push:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "apps/agent/**", "xtask/**", ".github/workflows/rust-agent.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "apps/agent/**", "xtask/**", ".github/workflows/rust-agent.yml"]
concurrency:
  group: rust-agent-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows-agent-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build and verify standalone Windows Rust Agent
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- stage-agent --build-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Agent build failed" }
          cargo run --locked -p xtask -- verify-agent --build-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Agent integrity failed" }
          cargo run --locked -p xtask -- stage-agent-service --build-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Agent service staging failed" }
          cargo run --locked -p xtask -- verify-agent-service --build-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Agent service integrity failed" }
      - name: Agent payload contracts and package definitions (no installation)
        shell: pwsh
        run: |
          cargo test --locked -p racp-contract --test distribution --test service_scope
          if ($LASTEXITCODE -ne 0) { throw "Agent contract tests failed" }
          cargo test --locked -p racp-core --test distribution
          if ($LASTEXITCODE -ne 0) { throw "Agent admission tests failed" }
          cargo test --locked -p xtask --test agent_service
          if ($LASTEXITCODE -ne 0) { throw "Agent package definition tests failed" }
      - name: Admit pinned build-only NSIS compiler for requested service artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_artifacts }}
        shell: pwsh
        run: |
          $agentNsisArchive = Join-Path $env:RUNNER_TEMP 'agent-nsis-3.11.zip'
          $agentNsisTools = Join-Path $env:RUNNER_TEMP 'agent-nsis-3.11'
          Invoke-WebRequest -Uri 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' -OutFile $agentNsisArchive
          if ((Get-FileHash -LiteralPath $agentNsisArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') { throw "Pinned NSIS archive hash mismatch" }
          Expand-Archive -LiteralPath $agentNsisArchive -DestinationPath $agentNsisTools
          $agentNsisCompiler = Join-Path $agentNsisTools 'nsis-3.11/makensis.exe'
          if (-not (Test-Path -LiteralPath $agentNsisCompiler -PathType Leaf)) { throw "Pinned root NSIS compiler missing" }
          Split-Path -Parent $agentNsisCompiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Create requested Agent-only setup (no installer execution)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_artifacts }}
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- package-agent-service --build-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Agent service package creation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: racp-agent-win-x64-${{ github.sha }}
          path: |
            dist/agent/**/ci-${{ github.run_id }}-${{ github.run_attempt }}/build/**
            dist/agent/**/ci-${{ github.run_id }}-${{ github.run_attempt }}/staging/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_artifacts }}
        with:
          name: racp-agent-service-setup-win-x64-${{ github.sha }}
          path: dist/agent/**/ci-${{ github.run_id }}-${{ github.run_attempt }}/packages/**
          if-no-files-found: error
          retention-days: 14
  windows-rust:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
      RACP_TEST_CHROMIUM_PATH: ${{ github.workspace }}/.tools/playwright/chromium-1243/chrome-win64/chrome.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Stage pinned native Chromium for provider acceptance tests
        run: npx --yes --package=playwright@1.63.0 playwright install chromium
      - name: Windows process memory acceptance
        run: cargo test -p racp-runtime --test memory --locked
      - run: cargo test --workspace --locked
      - run: cargo build -p racp-agent -p racp-runtime --examples --locked
      - run: cargo build -p racp-agent --locked
