name: rust-agent
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run deferred native acceptance tests
        type: boolean
        default: false
  push:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "apps/agent-rust/**", "tests/rust_agent/**", ".github/workflows/rust-agent.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "apps/agent-rust/**", "tests/rust_agent/**", ".github/workflows/rust-agent.yml"]
concurrency:
  group: rust-agent-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-agent-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Compile Windows Rust Agent (tests deferred)
        run: cargo build -p racp-agent --release --locked --target x86_64-pc-windows-msvc
      - name: Package standalone Windows Rust Agent
        if: ${{ github.ref_name == 'master' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: ./scripts/build_rust_agent.ps1 -BuildId "${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@v4
        with:
          name: racp-agent-win-x64-${{ github.sha }}
          path: |
            target/x86_64-pc-windows-msvc/release/racp-agent.exe
            dist/rust-agent/**/*.zip
            dist/rust-agent/**/SHA256SUMS
            dist/rust-agent/**/build-manifest.json
          if-no-files-found: error
          retention-days: 14
  windows-rust:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
      RACP_TEST_CHROMIUM_PATH: ${{ github.workspace }}/.tools/playwright/chromium-1243/chrome-win64/chrome.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - name: Stage pinned native Chromium for provider acceptance tests
        run: uv run --frozen python -m playwright install chromium
      - name: Windows process memory acceptance
        run: cargo test -p racp-runtime --test memory --locked
      - run: cargo test --workspace --locked
      - run: cargo build -p racp-agent -p racp-runtime --examples --locked
      - run: cargo build -p racp-agent --locked
      - run: uv run --frozen pytest tests/rust_agent -v --tb=short
