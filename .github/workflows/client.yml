name: desktop-client
on:
  workflow_dispatch:
  push:
    paths: ["apps/client/**", "apps/agent/**", "packages/**", "scripts/**", "uv.lock", "pnpm-lock.yaml", ".github/workflows/client.yml"]
  pull_request:
    paths: ["apps/client/**", "apps/agent/**", "packages/**", "scripts/**", "uv.lock", "pnpm-lock.yaml", ".github/workflows/client.yml"]
jobs:
  native-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-14
            target: mac
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: node apps/client/node_modules/electron/install.js
      - run: uv run python scripts/build.py
      - run: uv run python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/client-browsers
      - run: uv run python scripts/stage_client_agent.py --browser-cache .tools/client-browsers
      - run: pnpm --dir apps/client build
      - run: pnpm --dir apps/client test
      - run: uv run pytest -q tests/unit/test_desktop_control.py
      - if: runner.os != 'Linux'
        shell: bash
        run: uv run python scripts/client_e2e.py --node "$(which node)"
      - if: runner.os == 'Linux'
        run: xvfb-run -a uv run python scripts/client_e2e.py --node "$(which node)"
      - run: pnpm --dir apps/client package --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-client-${{ matrix.os }}
          path: |
            dist/client-desktop/
            dist/client-desktop-e2e.png
