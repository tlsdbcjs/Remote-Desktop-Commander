name: native-client
on:
  push:
    branches: [master, "codex/**"]
    paths:
      - "apps/client-native/**"
      - "apps/agent/**"
      - "crates/**"
      - "xtask/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "docs/protocol/**"
      - "packages/protocol/src/racp_protocol/permission_catalog.json"
      - ".github/workflows/client.yml"
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: "Create unsigned Windows setup/portable/ZIP (no installation or GUI execution)"
        type: boolean
        default: false
      install_scope:
        description: "Windows setup scope (artifact definitions; no installation)"
        type: choice
        options: [user]
        default: user
      include_deferred_platforms:
        description: "Request deferred platforms (native runners/implementation remain unavailable)"
        type: boolean
        default: false
concurrency:
  group: native-client-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows-client:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      NATIVE_BUILD_ID: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@v4
      - name: Reject unavailable native platform requests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_deferred_platforms }}
        run: throw "macOS/Linux native implementation and runner acceptance remain deferred; definitions are available through xtask package --dry-run."
      - name: Install pinned Rust build toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed" }
          rustup default 1.90.0
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain selection failed" }
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            . -> target/native-product
      - name: Check source contracts and formatting (tests deferred)
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting failed" }
          cargo run --locked -p xtask -- inventory-check
          if ($LASTEXITCODE -ne 0) { throw "Contract inventory failed" }
          cargo clippy --locked -p racp-client-native --no-deps --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "Client clippy failed" }
      - name: Build native static CRT staging (no tests or GUI)
        run: |
          cargo run --locked -p xtask -- stage --platform win --arch x64 --build-id $env:NATIVE_BUILD_ID
          if ($LASTEXITCODE -ne 0) { throw "Native staging failed" }
          cargo run --locked -p xtask -- verify-staging --platform win --arch x64 --build-id $env:NATIVE_BUILD_ID
          if ($LASTEXITCODE -ne 0) { throw "Native staging integrity failed" }
      - name: Admit build-only NSIS compiler for requested artifact creation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_artifacts }}
        run: |
          $nsisArchive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          $nsisTools = Join-Path $env:RUNNER_TEMP 'racp-nsis-3.11'
          Invoke-WebRequest -Uri 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' -OutFile $nsisArchive
          $nsisHash = (Get-FileHash -LiteralPath $nsisArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nsisHash -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') { throw "Pinned NSIS archive hash mismatch" }
          Expand-Archive -LiteralPath $nsisArchive -DestinationPath $nsisTools
          $nsisCompilers = @(Get-ChildItem -LiteralPath $nsisTools -Filter 'makensis.exe' -Recurse -File)
          if ($nsisCompilers.Count -ne 1) { throw "Exactly one admitted NSIS compiler required" }
          $nsisCompilers[0].Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Create requested unsigned artifacts (no publishing, installation or acceptance)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_artifacts }}
        run: |
          cargo run --locked -p xtask -- package --platform win --arch x64 --build-id $env:NATIVE_BUILD_ID --install-scope '${{ inputs.install_scope }}'
          if ($LASTEXITCODE -ne 0) { throw "Native artifact creation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: racp-native-staging-win-x64-${{ github.sha }}
          path: dist/client/**/ci-${{ github.run_id }}-${{ github.run_attempt }}/staging/**
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_artifacts }}
        with:
          name: racp-native-packages-win-x64-${{ github.sha }}
          path: dist/client/**/ci-${{ github.run_id }}-${{ github.run_attempt }}/packages/**
          if-no-files-found: error
          compression-level: 0
