name: rust-client
on:
  push:
    paths: ["apps/client/**", "crates/**", "Cargo.*", "pnpm-lock.yaml", ".github/workflows/client.yml", "scripts/*client*.mjs"]
  pull_request:
    paths: ["apps/client/**", "crates/**", "Cargo.*", "pnpm-lock.yaml", ".github/workflows/client.yml", "scripts/*client*.mjs"]
  workflow_dispatch:
concurrency:
  group: rust-client-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/client/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/client build
      - name: Stage pinned fixed WebView2
        run: node scripts/stage-webview2.mjs 
      - name: Compile Windows host (tests deferred)
        run: cargo build --release --locked --manifest-path apps/client/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: racp-client-win-x64-${{ github.sha }}
          path: apps/client/src-tauri/target/x86_64-pc-windows-msvc/release/racp-client.exe
          if-no-files-found: error
