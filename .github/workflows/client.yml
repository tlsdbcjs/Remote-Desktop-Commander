name: rust-client
on:
  push:
    branches: [master, codex/client-rust-migration]
    paths: ["apps/client/**", "crates/**", "Cargo.*", "pnpm-lock.yaml", ".github/workflows/client.yml", "scripts/*client*.mjs"]
  workflow_dispatch:
concurrency:
  group: rust-client-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/client/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/client build
      - name: Build Windows setup and portable artifacts (tests deferred)
        run: node scripts/build-client.mjs --build-id "${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@v4
        with:
          name: racp-client-win-x64-${{ github.sha }}
          path: |
            dist/client-desktop/**/RACP-Client-*.exe
            dist/client-desktop/**/*.zip
            dist/client-desktop/**/build-manifest.json
            dist/client-desktop/**/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
