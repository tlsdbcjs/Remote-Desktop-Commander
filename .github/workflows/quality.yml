name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Explicitly resume deferred migration acceptance tests
        type: boolean
        default: false
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
jobs:
  server-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv lock --check
      - run: uv sync --all-packages --frozen
      - name: Compile retained Python server and CLI sources (tests deferred)
        run: uv run --frozen python -m compileall -q apps/gateway apps/cli packages scripts
      - run: uv run --frozen mypy
      - run: uv run --frozen python scripts/build.py
  rust-format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path apps/client/src-tauri/Cargo.toml --check
  python:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - run: npx --yes --package=playwright@1.63.0 playwright install --with-deps chromium
      - run: cargo build -p racp-agent --locked
      - run: cargo build -p racp-runtime --examples --locked
      - run: uv run --frozen python scripts/check.py
      - run: uv run --frozen python scripts/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racp-${{ matrix.os }}
          path: dist/
  console:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/console_build.py
      - run: pnpm --dir apps/console exec playwright install --with-deps chromium
      - run: cargo build -p racp-agent --locked
      - run: uv run python scripts/console_e2e.py --node $(which node)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racp-console
          path: |
            apps/console/dist/
            apps/console/test-results/
            dist/console-*
