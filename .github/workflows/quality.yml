name: quality
on: [push, pull_request]
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - run: uv run python -m playwright install --with-deps chromium
      - run: cargo build -p racp-agent --locked
      - run: cargo build -p racp-runtime --examples --locked
      - run: uv run --frozen python scripts/check.py
      - run: uv run --frozen python scripts/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racp-${{ matrix.os }}
          path: dist/
  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv python install 3.12.11
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/console_build.py
      - run: pnpm --dir apps/console exec playwright install --with-deps chromium
      - run: uv run python scripts/console_e2e.py --node $(which node)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racp-console
          path: |
            apps/console/dist/
            apps/console/test-results/
            dist/console-*
